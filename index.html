<div class="container" id="f">
    
    <h2 id="sectionhead" class="fw-bold display-6" style="text-align: center;">OBMC Enrollment Page</h2>
    <form id="contact" action="page2.html">
        <div class="row">
            <label class="fw-bold">Student Information</label>
            <div class="col">
            
                <input type="text" class="form-control" placeholder="Type here..." required>
                <label for="fname" class="form-label">First Name</label>
            </div>

                <div class="col">
                    <input type="text" class="form-control" placeholder="Type here..." required>
                    <label for="lname" class="form-label">Surname</label>
            </div>
        </div>

        <div class="row">
            <div class="col">
                <input type="date" class="form-control" placeholder="Type here..." required>
                <label for="bday" class="form-label">Birth Date</label>
            </div>

                <div class="col">
                    <input type="number" class="form-control" placeholder="Type here..." required>
                    <label for="age" class="form-label">Age</label>
            </div>
        </div>
        <br>

        <div class="row">
            <label class="fw-bold">Academic History and Program</label>

            <div class="col">
                <input type="text" class="form-control" placeholder="Type here..." required>
                <label for="pastschl" class="form-label">Previous School</label>
            </div>

            <div class="col">
                    <select id="gradelvl" name="gradelvl">
                        <option value="jc">Junior Casa</option>
                        <option value="ac">Advanced Casa</option>
                        <option value="g1">Grade 1</option>
                        <option value="g2">Grade 2</option>
                        <option value="g3">Grade 3</option>
                        <option value="g4">Grade 4</option>
                        <option value="g5">Grade 5</option>
                        <option value="g6">Grade 6</option>
                        <option value="g7">Grade 7</option>
                        <option value="g8">Grade 8</option>
                        <option value="g9">Grade 9</option>
                        <option value="g10">Grade 10</option>
                        <option value="g11">Grade 11</option>
                        <option value="g12">Grade 12</option>
                </select>
                <br>
                <label for="fruit">Grade Level</label>
            </div>
        </div>

        <br>

        <div class="row">
            <label class="fw-bold">Recieve Updates</label>
            <div class="col">
            
                <input type="text" class="form-control" placeholder="Type here..." required>
                <label for="mail" class="form-label">Email</label>
            </div>

                <div class="col">
                    <input type="number" class="form-control" placeholder="Type here..." required>
                    <label for="pnumber" class="form-label">Phone Number</label>
            </div>
        </div>

                

                <br>
                <br>
